name: Release

# Push a tag like v0.4.0 (e.g. `npm version minor && git push --follow-tags`).
# Installers are attached to a draft GitHub Release for you to review and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: dist/*.dmg
          - os: windows-latest
            files: dist/*Setup*.exe
          - os: ubuntu-latest
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      # Only the installers leave the runner; zips, blockmaps and update metadata stay behind.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -1 installers
          test "$(ls -1 installers | wc -l)" -eq 5 || { echo "::error::Expected 5 installers"; exit 1; }
          cat > notes.md <<EOF
          ## Which file do I download?

          | Your computer | Download |
          | --- | --- |
          | Mac with Apple Silicon (M1 or later) | \`Git-Profile-Map-${version}-mac-arm64.dmg\` |
          | Mac with Intel | \`Git-Profile-Map-${version}-mac-x64.dmg\` |
          | Windows | \`Git-Profile-Map-Setup-${version}.exe\` |
          | Linux | \`Git-Profile-Map-${version}.AppImage\`, or the \`.deb\` on Debian/Ubuntu |

          Not sure which Mac you have? Apple menu → About This Mac: "Chip: Apple M…" means Apple Silicon.
          **macOS:** the app isn't notarized yet. If macOS says it can't verify the app, open System Settings → Privacy & Security and click **Open Anyway**.
          EOF
          gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Git Profile Map $version" --notes-file notes.md --generate-notes
